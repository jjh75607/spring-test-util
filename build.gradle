plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'com.diffplug.spotless' version '8.9.0'
}

// com.github.* 는 github.com 소유자가 아니면 Central 네임스페이스를 받을 수 없다.
group = 'io.github.jjh75607'

// CI 의 소비자 스모크 테스트가 -PpublishVersion 으로 SNAPSHOT 을 발행한다.
// SNAPSHOT 은 서명을 건너뛰므로 키 없이 로컬 저장소로 낼 수 있다.
version = findProperty('publishVersion') ?: '0.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // withSourcesJar 와 withJavadocJar 는 두지 않는다. 배포 플러그인이 만드는 것과
    // 파일 이름이 겹쳐 publishToMavenLocal 이 실패한다.
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// 발행물에 그대로 실려 나간다. 비워두면 사용자가 설치할 수 없다. 이슈 #98 이다.
// 하한이라야 사용자가 쓰는 더 높은 버전이 이긴다.
def springBootFloor = '3.0.0'
def springFrameworkFloor = '6.0.2'
def junitFloor = '5.9.1'

// CI 가 -PspringBootVersion 으로 지원 범위를 검증한다.
def springBootForBuild = findProperty('springBootVersion') ?: '3.5.0'

// 지금 스타일을 고정하는 것이 목적이다. 재포맷하지 않는다.
// spring-javaformat 은 들여쓰기가 탭이라 저장소 전체가 바뀌므로 쓰지 않는다.
// import 순서는 이미 일관적이라 규칙을 걸지 않는다. 필요해지면 그때 추가한다.
spotless {
    java {
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
}

wrapper {
    gradleVersion = "8.13"
    distributionType = Wrapper.DistributionType.ALL
}

mavenPublishing {
    publishToMavenCentral()

    // 서명 키가 없으면 publishToMavenLocal 도 실패한다. -PsigningInMemoryKey 로 넘긴다.
    signAllPublications()

    pom {
        name = 'query-counter'
        description = 'A test library for asserting how many queries a Spring test executes, and how long they take.'
        inceptionYear = '2025'
        url = 'https://github.com/jjh75607/query-counter'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'jjh75607'
                name = 'jjh75607'
                url = 'https://github.com/jjh75607'
            }
        }
        scm {
            url = 'https://github.com/jjh75607/query-counter'
            connection = 'scm:git:git://github.com/jjh75607/query-counter.git'
            developerConnection = 'scm:git:ssh://git@github.com/jjh75607/query-counter.git'
        }
    }
}

// 배포 태스크에만 물려 있어서 붙인다. 없으면 javadoc 이 깨져도 릴리스 때까지 모른다.
tasks.named('assemble') {
    dependsOn 'sourcesJar', 'plainJavadocJar'
}

dependencies {
    api "org.junit.jupiter:junit-jupiter-api:${junitFloor}"

    // Spring TestContext. TestExecutionListener 등록에 필요하다.
    // 이 라이브러리를 쓰는 쪽은 이미 테스트 클래스패스에 갖고 있다.
    api "org.springframework:spring-test:${springFrameworkFloor}"

    implementation "org.springframework.boot:spring-boot-starter:${springBootFloor}"
    implementation 'net.ttddyy:datasource-proxy:1.10.1'

    // enforcedPlatform 이라 위에 적은 하한을 덮어쓴다. 셋 다 발행되지 않는 구성이다.
    def bootBom = "org.springframework.boot:spring-boot-dependencies:${springBootForBuild}"
    compileOnly enforcedPlatform(bootBom)
    annotationProcessor enforcedPlatform(bootBom)
    testImplementation enforcedPlatform(bootBom)

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 빠지면 테스트를 하나도 못 찾고 엔진 버전이 어긋났다는 엉뚱한 메시지가 나온다.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'com.h2database:h2'

    // example 패키지의 JPA 예제용. testImplementation 이라 소비자에게 전이되지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}

tasks.named('test') {
    useJUnitPlatform()
}
